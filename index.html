<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff9eaf" />
  <meta name="description" content="A tiny apology from Prashant to Suhan ❤️" />
  <title>Suhan 💗 — One Tiny Apology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="floating-decor" id="floatingDecor" aria-hidden="true"></div>

  <main class="app-shell">
    <section class="card" id="card" aria-live="polite">
      <div class="tiny-line" id="tinyLine">made with a little love, a lot of sorry & one teddy 🧸</div>
      <div class="hero-teddy" id="heroTeddy" aria-hidden="true">🧸</div>
      <div class="eyebrow">For Suhan, from Prashant 💗</div>
      <h1 id="title">Suhan, are you angry with Prashant? 🥺</h1>
      <p id="subtitle">Be honest… I promise I'm not going to run away. 🥹</p>

      <div class="button-row" id="choiceRow">
        <button class="btn btn-yes" id="yesBtn">Yes 😤</button>
        <button class="btn btn-no" id="noBtn">No 🙈</button>
      </div>

      <div class="promise-strip" id="promiseStrip">
        <span>🧸</span><span>💗</span><span>🥭</span><span>✨</span><span>💗</span><span>🧸</span>
      </div>
      <div class="progress-dots" id="progressDots" aria-hidden="true">
        <span class="dot active"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
